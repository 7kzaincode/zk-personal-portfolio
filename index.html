  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            serif: ['"EB Garamond"', 'serif'],
            display: ['"Playfair Display"', 'serif'],
            sans: ['Inter', 'sans-serif'],
          }

  <link
    href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500;600&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@100;300;400;500;600&display=swap"
    rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      overflow-x: hidden;
    }

    .serif {
      font-family: 'EB Garamond', serif;
    }

    .serif-display {
      font-family: 'Playfair Display', serif;
    }

    /* Hide scrollbar for Chrome, Safari and Opera */
    ::-webkit-scrollbar {
      display: none;
    }

    /* Hide scrollbar for IE, Edge and Firefox */
    html,
    body {
      -ms-overflow-style: none;
      /* IE and Edge */
      scrollbar-width: none;
      /* Firefox */
    }

    @keyframes fade-in {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    @keyframes zoom-in {
      from {
        transform: scale(0.95);
      }

      to {
        transform: scale(1);
      }
    }

    .animate-in {
      animation-fill-mode: both;
    }

    .fade-in {
      animation-name: fade-in;
    }

    .zoom-in {
      animation-name: zoom-in;
    }
  </style>
