      @keyframes fade-in {
        from { opacity: 0; }
        to { opacity: 1; }

      @keyframes zoom-in {
        from { transform: scale(0.95); }
        to { transform: scale(1); }
      }
      .animate-in {
        animation-fill-mode: both;
      }
      .fade-in {
        animation-name: fade-in;
      }
      .zoom-in {
        animation-name: zoom-in;
      }
